services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ops_intelligence}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  bootstrap:
    build: .
    command: ["python", "-m", "scripts.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ops_intelligence}
    volumes: ["./data:/app/data", "./artifacts:/app/artifacts", "./reports:/app/reports"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ops_intelligence}
      AI_PROVIDER: ${AI_PROVIDER:-evidence}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./artifacts:/app/artifacts:ro", "./data:/app/data:ro", "./reports:/app/reports:ro"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
  spark:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: spark_jobs/Dockerfile
    volumes: ["./data:/app/data"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
volumes:
  pgdata:
